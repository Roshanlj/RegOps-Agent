services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      PG_URL: postgresql+psycopg2://regops:regops@db:5432/regops
      EMBEDDINGS_OFFLINE: "0"
    depends_on:
      - db

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: regops
      POSTGRES_USER: regops
      POSTGRES_PASSWORD: regops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
  ollama:
